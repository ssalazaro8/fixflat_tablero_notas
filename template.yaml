AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Team Portal with Shared Notes Board - Production Ready

  Architecture:
  - EC2 (t2.micro): Flask API backend in Docker
  - Lambda: Dashboard metrics calculation
  - S3: Frontend static files
  - CloudFront: CDN distribution
  - RDS (SQLite local): Embedded database

  All within AWS Free Tier limits

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment (dev or prod)

  LatestAmiId:
    Type: AWS::EC2::Image::Id
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: Latest Amazon Linux 2 AMI

Resources:
  # ============= VPC AND NETWORKING =============

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-vpc-${Environment}'

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-subnet-${Environment}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-igw-${Environment}'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-rt-${Environment}'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============= SECURITY GROUP FOR EC2 =============

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for team portal API backend
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from anywhere
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0
          Description: Flask app port
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH for management
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-sg-${Environment}'

  # ============= IAM ROLE FOR EC2 =============

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !Sub '${FrontendBucket.Arn}/*'
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-ec2-role-${Environment}'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ============= EC2 INSTANCE =============

  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      SubnetId: !Ref PublicSubnet
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl start docker
          systemctl enable docker
          usermod -a -G docker ec2-user

          cd /opt
          git clone https://github.com/ssalazaro8/fifxflat_-tablero_de_notas.git
          cd fifxflat_-tablero_de_notas

          docker-compose up -d
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-backend-${Environment}'

  # ============= S3 FOR FRONTEND =============

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'team-portal-frontend-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-s3-${Environment}'

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ============= CLOUDFRONT DISTRIBUTION =============

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: OAI for team portal frontend

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        PriceClass: PriceClass_100
      Tags:
        - Key: Name
          Value: !Sub 'team-portal-cdn-${Environment}'

  # ============= LAMBDA FUNCTION =============

  DashboardMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'team-portal-metrics-${Environment}'
      CodeUri: src/lambda/
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Description: Calculate and deliver dashboard metrics
      Tags:
        team-portal: 'true'

  # ============= API GATEWAY =============

  MetricsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'team-portal-metrics-api-${Environment}'
      StageName: !Ref Environment
      Description: API for dashboard metrics

  MetricsApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MetricsApi
      ParentId: !GetAtt MetricsApi.RootResourceId
      PathPart: metrics

Outputs:
  BackendInstancePublicIP:
    Description: Public IP address of the Flask backend
    Value: !GetAtt BackendInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-BackendIP'

  BackendURL:
    Description: Backend API URL
    Value: !Sub 'http://${BackendInstance.PublicIp}:5000'
    Export:
      Name: !Sub '${AWS::StackName}-BackendURL'

  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  CloudFrontURL:
    Description: CloudFront distribution URL for frontend
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontURL'

  CloudFrontFullURL:
    Description: Full CloudFront HTTPS URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontFullURL'

  DashboardMetricsFunction:
    Description: Lambda function for dashboard metrics
    Value: !Ref DashboardMetricsFunction
    Export:
      Name: !Sub '${AWS::StackName}-MetricsFunction'

  MetricsApiEndpoint:
    Description: API Gateway endpoint for metrics
    Value: !Sub 'https://${MetricsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-MetricsAPI'
